# Reference Nginx server block for admin.kanshamissouri.com (Vite SPA, static files)
# Copy to /etc/nginx/sites-available/admin.kanshamissouri.com and symlink into
# sites-enabled, then run `certbot --nginx -d admin.kanshamissouri.com`
# to add HTTPS (certbot will edit this file in place to add the SSL server block).
#
# Adjust `root` below to the actual path where this repo is cloned on the server.

server {
    listen 80;
    listen [::]:80;
    server_name admin.kanshamissouri.com;

    root /home/deploy/apps/admin-kansha-2026/dist;
    index index.html;

    # hashed build assets (vite output) can be cached aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # client-side routing (react-router) fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
